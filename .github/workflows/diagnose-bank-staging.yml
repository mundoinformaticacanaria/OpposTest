name: Diagnose bank staging

on:
  push:
    branches:
      - feat/10-bancos-publicos-autoria

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staging fragments
        shell: bash
        run: |
          set -u
          if [ -f .bank-staging/diagnostic.txt ]; then
            echo "Diagnostic already exists."
            exit 0
          fi
          {
            echo "FILES"
            find .bank-staging -maxdepth 1 -type f -name 'part-*' -printf '%f %s bytes\n' | sort
            echo
            echo "CONCAT_SHA256"
            cat .bank-staging/part-* | sha256sum
            echo
            echo "DECODED_SHA256"
            cat .bank-staging/part-* | base64 --decode 2>/dev/null | sha256sum || true
            echo
            echo "PREVIEW_BASE64"
            set +e
            cat .bank-staging/part-* | base64 --decode 2>/dev/null | gzip -dc 2>/dev/null | head -c 4096 | base64 -w0
            echo
          } > .bank-staging/diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          if git diff --quiet -- .bank-staging/diagnostic.txt && git ls-files --error-unmatch .bank-staging/diagnostic.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bank-staging/diagnostic.txt
          git commit -m "Diagnosticar fragmentos temporales del banco"
          git push
