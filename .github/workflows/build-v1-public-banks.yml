name: Build v1 public banks

on:
  push:
    branches:
      - release/v1.0.0-mvp
    paths:
      - .build-v1-public-banks
      - .bank-source-fixes/fixes.tar.gz
      - .github/workflows/build-v1-public-banks.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.0-mvp
          fetch-depth: 0

      - name: Recover and repair verified source
        run: |
          echo '851edcc0c1fa525df63c16fe4d5e9213523c19c4f8f9580325622451ab6e7a0a  .bank-source-fixes/fixes.tar.gz' | sha256sum --check
          git fetch origin feat/10-bancos-publicos-autoria --depth=1
          mkdir -p /tmp/oppostest-bank-source
          for index in $(seq -w 0 13); do
            git show FETCH_HEAD:.bank-source-v3/chunk-$index > /tmp/oppostest-bank-source/chunk-$index
          done
          tar -xzf .bank-source-fixes/fixes.tar.gz -C /tmp/oppostest-bank-source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'chunk-00': 'dd4345171d9371c61d466aa739239563d346109f14cbc70f0ed7b313a3464dba',
              'chunk-01': '668081a281c09dce666527a3cce8a9ebf21512412d0b0705d84b43ebecf7005e',
              'chunk-02': 'f687939d68d897f07e401688bb3c4ef76848b450641dd6db5748d22131794108',
              'chunk-03': '61d5c8e0fef9e999c6de0347042be2da13bb533474b64b4549eafbd16ccdd179',
              'chunk-04': 'a31d1d3c327e19919c5361d4a0d4e2ad8c3b51c1acd7f5c89b782732c6932067',
              'chunk-05': '8ff6cb9500f0d6b364c9f2cbd787fbee637803584086d59e16c40ddae37b6dde',
              'chunk-06': '15c3bf21d655eff3bb7ebdc27c0aadecdf2d60b20d43262d665e19a6e9dd6104',
              'chunk-07': '70e2068ab94a431b054dcf0d011e131236772d2d27a7c189cdebae66a6eef8db',
              'chunk-08': '079ed9ac7bf6b34c7ceec0259afd33acd398c099848c615ffd4b297efa1a5f94',
              'chunk-09': '1c4e090f6a9199514486f10955947be7dad8ce96ec99ec47301b3b94bda7dbe1',
              'chunk-10': '36a1a381a9b3acd010e96e5ec80f0cc9b39783dc30ddd02adbd11156a15723f4',
              'chunk-11': '6c4cb86eb6db17236f0710eb13e997a5cde5df28c4368ddd5f5d989498dc2658',
              'chunk-12': 'c0089535d1d7587baf5f1aec73a34fa20750ac75c16cc0b140b676f973fcb816',
              'chunk-13': 'ae6c7c9a21912a9b0495f0744b5531e21626377c7afeb3baa9aa67f59f986d51',
          }
          for chunk in sorted(Path('/tmp/oppostest-bank-source').glob('chunk-*')):
              content = chunk.read_text(encoding='utf-8').strip()
              digest = hashlib.sha256(content.encode()).hexdigest()
              print(chunk.name, len(content), digest)
              if digest != expected[chunk.name]:
                  raise SystemExit(f'Huella incorrecta en {chunk.name}')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate four public banks
        run: python3 scripts/build-public-banks-v1.py /tmp/oppostest-bank-source

      - name: Validate MVP
        run: npm run check

      - name: Remove one-use build files
        run: |
          rm -rf .bank-source-fixes
          rm -f .build-v1-public-banks
          rm -f scripts/build-public-banks-v1.py
          rm -f .github/workflows/build-v1-public-banks.yml

      - name: Commit public banks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar bancos de preguntas de OpposTest v1.0.0"
          git push origin HEAD:release/v1.0.0-mvp
