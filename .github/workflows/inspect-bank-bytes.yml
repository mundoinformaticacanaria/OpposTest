name: Inspect bank bytes

on:
  push:
    branches:
      - feat/10-bancos-publicos-autoria

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump headers
        shell: bash
        run: |
          if [ -f .bank-staging/tar-header.hex ]; then
            exit 0
          fi
          cat .bank-staging/part-0{0,1,2,3,4,5} | base64 --decode > /tmp/banks-prefix.tar.gz
          gzip -dc /tmp/banks-prefix.tar.gz > /tmp/banks-prefix.tar || true
          xxd -p -c32 -l1024 /tmp/banks-prefix.tar > .bank-staging/tar-header.hex
          xxd -p -c32 -l128 /tmp/banks-prefix.tar.gz > .bank-staging/gzip-header.hex
      - name: Commit headers
        shell: bash
        run: |
          if git diff --quiet -- .bank-staging/tar-header.hex .bank-staging/gzip-header.hex && git ls-files --error-unmatch .bank-staging/tar-header.hex >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bank-staging/tar-header.hex .bank-staging/gzip-header.hex
          git commit -m "Registrar cabeceras binarias del banco temporal"
          git push
