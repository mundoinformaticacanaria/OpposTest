name: Bootstrap OpposTest

on:
  push:
    branches:
      - agent/inicializar-oppostest-v0.1
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode > /tmp/oppostest.tar.gz
          mkdir -p /tmp/oppostest
          tar -xzf /tmp/oppostest.tar.gz -C /tmp/oppostest
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/oppostest/ ./
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Inicializar OpposTest v0.1"
          git push
