name: Repair bank part 02

on:
  push:
    branches:
      - feat/10-bancos-publicos-autoria

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and verify fragment
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.bank-staging/part-02')
          expected = '1a3dfcb7baea596c7b86648a280326e6481b7680f9eeeca38ace3279687162c1'
          data = path.read_text()
          if sha256(data.encode()).hexdigest() == expected:
              raise SystemExit(0)
          old = 'KGA672A672'
          new = 'KGAa72A672'
          if data.count(old) != 1:
              raise SystemExit('No se encontró la corrupción esperada de forma única.')
          data = data.replace(old, new, 1)
          actual = sha256(data.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA inesperado tras reparar: {actual}')
          path.write_text(data)
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- .bank-staging/part-02; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bank-staging/part-02
          git commit -m "Reparar fragmento temporal part-02"
          git push
