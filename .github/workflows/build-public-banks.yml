name: Build public banks

on:
  push:
    branches:
      - feat/10-bancos-publicos-autoria
    paths:
      - '.bank-build-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build public bank files
        run: python scripts/build-public-banks-v3.py

      - name: Run project checks
        run: npm run check

      - name: Commit generated banks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banks/*.json banks/build-report.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generar bancos públicos validados"
          git push
